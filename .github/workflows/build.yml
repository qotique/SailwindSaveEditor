name: Build

on:
  push:
    branches: [main, packaging]
    tags: ['*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce nrbf pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce nrbf numpy
      - name: Build Linux
        run: |
          pyinstaller --clean --onefile --name sailwind_editor_linux \
            --add-data "core.py:." \
            --add-data "ui.py:." \
            --add-data "widgets.py:." \
            --add-data "translations.py:." \
            --add-data "grass.py:." \
            --add-data "watershader.py:." \
            --add-data "grass_assets:grass_assets" \
            --hidden-import numpy \
            sailwind_editor.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sailwind_editor_linux
          path: dist/sailwind_editor_linux

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce nrbf numpy
      - name: Build Windows
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --name sailwind_editor_windows.exe `
            --add-data "core.py;." `
            --add-data "ui.py;." `
            --add-data "widgets.py;." `
            --add-data "translations.py;." `
            --add-data "grass.py;." `
            --add-data "watershader.py;." `
            --add-data "grass_assets;grass_assets" `
            --hidden-import numpy `
            sailwind_editor.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sailwind_editor_windows
          path: dist/sailwind_editor_windows.exe

  release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sailwind_editor_linux
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sailwind_editor_windows
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sailwind_editor_linux
            dist/sailwind_editor_windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}